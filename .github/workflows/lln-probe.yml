name: LLN – podgląd strony ofert
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: |
          mkdir -p _lln/probe; cd _lln/probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sL -A "$UA" -o list.html -w "%{http_code} %{size_download}\n" "https://llnmarbella.com/rynek-wtorny/" > status.txt
          grep -oE 'https://llnmarbella\.com/[^"'"'"' ]*' list.html | sort -u > links.txt || true
          D=$(grep -iE 'rynek-wtorny/.+|property|nieruchomosc|oferta' links.txt | grep -v '/rynek-wtorny/$' | head -1)
          echo "detail: $D" >> status.txt
          [ -n "$D" ] && curl -sL -A "$UA" -o detail.html -w "%{http_code} %{size_download}\n" "$D" >> status.txt
          ls -la >> status.txt
      - run: |
          git config user.name Oliwiana; git config user.email noreply@solysol.pl
          git add _lln/probe; git commit -qm "lln: podgląd strony" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
