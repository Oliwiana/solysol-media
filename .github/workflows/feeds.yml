name: Źródła – monitor RSS
on:
  schedule:
    - cron: "*/10 5-22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: feeds
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: python3 _tools/feeds.py
      - run: |
          git config user.name Oliwiana; git config user.email noreply@solysol.pl
          git add _feeds/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "źródła $(date -u +%H:%M)" -q
          for i in 1 2 3; do { git rebase --abort 2>/dev/null; git pull --rebase -X theirs -q origin main; } && git push -q origin HEAD:main && break; sleep 5; done
