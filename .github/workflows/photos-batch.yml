name: Zdjęcia – Commons (wiele zapytań)
on:
  workflow_dispatch:
    inputs:
      query: { description: "Zapytania rozdzielone ||", required: true }
      count: { description: "Ile zdjęć na zapytanie", required: false, default: "5" }
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: python3 _tools/commons.py "${{ github.event.inputs.query }}" "${{ github.event.inputs.count }}"
      - run: |
          git config user.name Oliwiana; git config user.email noreply@solysol.pl
          git add _photos/commons
          git diff --cached --quiet && exit 0
          git commit -qm "zdjęcia (batch): ${{ github.event.inputs.query }}"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 10 + 5)); done
