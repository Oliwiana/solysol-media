</div>
<script>
const SH=__SH__, PH=__PH__, LB=__LB__;
const E=(a,b,t)=>{let x=Math.max(0,Math.min(1,(t-a)/b));return x*x*(3-2*x)};
const ROT=[-3,2.5,-1.5,3,-2.5,1.5,-3.5,2];
const sh=document.getElementById('shots');
SH.forEach((s,i)=>{if(i<2)return;const d=document.createElement('div');d.className='pol';d.id='s'+i;d.dataset.r=ROT[i%8];d.dataset.x=((i*37)%50)-25;
d.innerHTML='<div class=pin></div><div class=w><img src="img/'+s[1]+'"></div><div class=l>'+LB[i]+'</div>';sh.appendChild(d)});
const CARDS=__CARDS__;
const cd=document.getElementById('cards');
CARDS.forEach((c,i)=>{const d=document.createElement('div');d.className='c '+(c.cls||'');d.id='c'+i;d.style.cssText=c.css+';transform:rotate('+(c.r||0)+'deg)';d.dataset.r=c.r||0;d.innerHTML=(c.pin?'<div class=pin></div>':'')+c.h;cd.appendChild(d)});
function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
window.setT=function(t){
 document.getElementById('board').style.transform='scale('+(1.02+0.02*Math.sin(t*.2))+')';
 // hook
 const hk=document.getElementById('hook');hk.style.opacity=1-E(2.7,0.25,t);hk.style.display=t>3?'none':'block';
 hk.querySelector('.bg').style.transform='scale('+(1.05+0.03*t)+')';document.getElementById('snd').style.opacity=Math.floor(t*2.5)%2?0.55:1;
 // shots
 for(let i=2;i<SH.length;i++){const el=document.getElementById('s'+i);const a=SH[i][0],b=(i+1<SH.length?SH[i+1][0]:99);
  if(t<a-0.01||t>b+0.45){el.style.opacity=0;continue}
  const k=E(a,0.28,t);const out=E(b+0.15,0.3,t);el.style.opacity=k*(1-out);
  el.style.transform='translate('+el.dataset.x+'px,'+(-30*(1-k))+'px) rotate('+el.dataset.r+'deg) scale('+(1.12-0.12*k)+')';el.style.zIndex=i;
  const p=Math.max(0,Math.min(1,(t-a)/Math.max(1,(b-a)+0.4)));const im=el.querySelector('img');
  const dir=i%2?1:-1;im.style.transform='scale('+(1.06+0.12*p)+') translate('+(dir*28*(p-.5))+'px,'+(-14*(p-.5))+'px)'}
 // cards
 CARDS.forEach((c,i)=>{const el=document.getElementById('c'+i);if(t<c.a||t>c.b+0.3){el.style.opacity=0;return}
  const k=E(c.a,0.3,t),o=E(c.b,0.3,t);el.style.opacity=k*(1-o);el.style.transform='rotate('+el.dataset.r+'deg) scale('+((c.s0||1.2)-((c.s0||1.2)-1)*k)+')';el.style.zIndex=100;
  if(c.cnt){const n=el.querySelector('.n');const q=E(c.a,c.cnt[1],t);n.textContent=fmt(Math.round(c.cnt[0]*q))}});
 // captions
 const cap=document.getElementById('cap');let ph=null;if(t>2.9)for(const p of PH){if(t>=p[0][1]-0.05&&t<=p[p.length-1][2]+0.3)ph=p}
 if(!ph||t>58.3){cap.style.opacity=0}else{cap.style.opacity=1;cap.innerHTML=ph.map(w=>'<span style="display:'+(t>=w[1]-0.03?'inline':'none')+';color:'+(w[3]?'#f2e35b':'#fff')+'">'+w[0]+'</span>').join(' ')}
 const en=document.getElementById('end');en.style.opacity=E(58.3,0.4,t);document.getElementById('endc').style.transform='translateY('+(60*(1-E(58.3,0.4,t)))+'px)';
};
