<div id=head><div class=br>SOL <i>y</i> SÓL</div><div class=lb>TEORIA KONTRA FAKTY</div></div>
<div id=cap><div></div></div><div id=cr></div>
<script>
const D=__DATA__;const HOOKEND=D.hookEnd;
const st=document.getElementById('stage');

D.shots.forEach((s,i)=>{const el=document.createElement('div');el.className='shot';el.id='s'+i;
 if(s.c==='HOOK'){el.innerHTML=`<div class=full><img src="${s.p}"></div><div class=tint></div>
 <div style="position:absolute;left:64px;right:140px;top:600px"><span class="lab yel">Andaluzja · 1989</span>
 <h1 class=h>Czy wojsko<br><u>ukrywa UFO</u><br>nad <em>Andaluzją</em>?</h1><span class="lab blue">Teoria kontra fakty</span></div>`}
 else if(s.c==='VERDICT'){el.innerHTML=`<div class=full><img src="${s.p}"></div><div class=tint style="background:rgba(8,10,20,.78)"></div>
 <div style="position:absolute;left:64px;right:140px;top:400px;text-align:center"><span class="lab blue">Werdykt</span><div style="margin:60px 0 50px"><span class=stamp style="font-size:118px;padding:16px 36px 24px;line-height:1.05">CZĘŚCIOWO<br>PRAWDA</span></div>
 <div style="font-family:S;font-style:italic;font-size:54px;line-height:1.15">Tajne akta istnieją. Dowodów na kosmitów w nich brak.</div>
 <div style="margin-top:34px"><span class="lab yel" style="font-size:34px">Potwierdzone: 80 raportów, 1962–1995</span></div></div>`}
 else if(s.c==='ASK'){el.innerHTML=`<div class=full><img src="${s.p}"></div><div class=tint></div>
 <div style="position:absolute;left:64px;right:140px;top:640px"><h1 class=h style="font-size:150px">A Ty<br><u>wierzysz</u>?</h1><span class="lab yel">Napisz w komentarzu</span></div>`}
 else if(s.c==='END'){el.innerHTML=`<div class=full><img src="${s.p}"></div><div class=tint style="background:rgba(8,10,20,.8)"></div>
 <div style="position:absolute;left:64px;right:140px;top:720px;text-align:center"><div style="font-family:S;font-style:italic;font-size:64px">Obserwuj</div>
 <div style="font-family:O;font-weight:600;font-size:140px;letter-spacing:-.02em;margin:10px 0 30px">@solysol.pl</div><span class="lab blue">Więcej historii z wybrzeża</span></div>`}
 else{let card='';if(s.c==='QUOTE'){card=`<div class=card style="left:110px;top:900px;max-width:780px;transform:rotate(-1.5deg)"><div class=pin></div><i>W. Churchill, 2.09.1944:</i><div style="font-size:34px;margin:10px 0 14px">„The establishment of the apes on Gibraltar should be twenty-four.”</div><b>Małp ma być <span style="display:inline;font-size:inherit;color:#a3150c;margin:0">24</span>.</b></div>`}
  else if(s.c){card=`<div class=card style="transform:rotate(${-s.r*0.8}deg)"><div class=pin></div>${s.c}</div>`}
  el.innerHTML=`<div class=pol style="transform:rotate(${s.r}deg)"><div class=pin></div><div class=win><img src="${s.p}"></div><div class=ill>zdjęcie ilustracyjne</div></div>${card}`}
 st.appendChild(el)});
const capEl=document.querySelector('#cap div');
const CR=__CR__;
function ease(x){return x<0?0:x>1?1:1-Math.pow(1-x,3)}
function setT(t){
 D.shots.forEach((s,i)=>{const el=document.getElementById('s'+i);const on=t>=s.s-0.001&&t<s.e+0.12;
  if(!on){el.style.opacity=0;return}
  const lt=t-s.s,d=s.e-s.s;el.style.opacity=t>s.e?Math.max(0,1-(t-s.e)/0.12):Math.min(1,lt/0.12+ (i==0?1:0));
  el.style.zIndex=i;
  const img=el.querySelector('img');const p=Math.min(1,lt/Math.max(d,0.1));const dir=i%2?1:-1;
  img.style.transform=`scale(${1.06+0.1*p}) translate(${dir*18*p}px,${-10*p}px)`;
  const pol=el.querySelector('.pol');if(pol){const k=ease(lt/0.25);pol.style.transform=`rotate(${s.r}deg) translateY(${(1-k)*40}px)`}
  const card=el.querySelector('.card');if(card){const k=ease((lt-0.15)/0.22);card.style.opacity=k;card.style.transform=`rotate(${-s.r*0.8}deg) scale(${1.25-0.25*k})`}
 });
 // captions
 const sh=D.shots.find(s=>t>=s.s&&t<s.e)||D.shots[D.shots.length-1];
 const hide=t<HOOKEND||(sh&&(sh.c==='END'));
 const c=D.caps.find(c=>t>=c.s&&t<c.e);
 if(!c||hide){capEl.style.visibility='hidden'}else{capEl.style.visibility='visible';
  capEl.innerHTML=c.w.map(w=>`<span class="${t>=w[1]-0.03?'on':''} ${w[2]?'y':''}">${w[0]}</span>`).join(' ')}
 document.getElementById('cr').textContent=sh?('FOT. '+(CR[sh.k]||'')+' · ZDJĘCIE ILUSTRACYJNE'):'';
 document.getElementById('head').style.opacity=1;
}
</script></body></html>
