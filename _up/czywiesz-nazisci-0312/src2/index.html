<div id=phs></div>
<div class=tint></div><div id=vig></div>
<svg class=grain width=1080 height=1920><filter id=n><feTurbulence id=turb type=fractalNoise baseFrequency=.9 numOctaves=3 seed=1 stitchTiles=stitch/></filter><rect width=100% height=100% filter=url(#n)/></svg>
<div class=brand>SOL <i>y</i> SÓL</div>
<div id=tl><span class="lab blue">Czy wiesz</span></div>
<div id=hook><span class="lab yel" style="font-size:42px">1945–2007 · Costa del Sol</span>
<h1 class=h style="margin-top:30px">Dlaczego<br><u>naziści</u><br>wybierali<br><em>emeryturę</em><br>na Costa del Sol?</h1></div>
<div id=cards></div>
<div id=cap></div>
<div id=cr></div>
<div id=end><div style="font-family:S;font-weight:600;font-size:64px;letter-spacing:.08em">SOL <i style="color:#f2e35b">y</i> SÓL</div>
<div style="font-family:O;font-weight:600;font-size:120px;margin-top:40px">@solysol.pl</div>
<div style="font-family:S;font-style:italic;font-size:54px;margin-top:26px;opacity:.9">Więcej historii z wybrzeża</div>
<div class="lab yel" style="margin-top:50px;font-size:40px">Obserwuj</div></div>
<script src=data.js></script><script>
const SC=window.SC, CARDS=window.CARDS, W=window.WORDS, END=window.ENDT;
const E=(a,b,t)=>{let x=Math.max(0,Math.min(1,(t-a)/b));return x*x*(3-2*x)};
const phs=document.getElementById('phs');
SC.forEach((s,i)=>{const d=document.createElement('div');d.className='ph';d.id='p'+i;d.style.backgroundImage='url('+s.img+')';if(s.pos)d.style.backgroundPosition=s.pos;phs.appendChild(d)});
const cd=document.getElementById('cards');
CARDS.forEach((c,i)=>{const d=document.createElement('div');d.className=c.cls;d.id='c'+i;d.innerHTML=c.html;d.style.cssText+=c.css;cd.appendChild(d)});
// phrases: split words into groups of <=3 / at punctuation
const PH=[];let cur=[];W.forEach(w=>{cur.push(w);if(cur.length>=3||/[.,?;:]$/.test(w[0])||w[0]=='–'){PH.push(cur);cur=[]}});if(cur.length)PH.push(cur);
window.setT=function(t){
 SC.forEach((s,i)=>{const nx=i+1<SC.length?SC[i+1].t:END+5;const el=document.getElementById('p'+i);
  const a=E(s.t-0.25,0.5,t)*(1-E(nx-0.25,0.5,t));el.style.opacity=a;
  const k=(t-s.t)/(nx-s.t+0.5);const z=1.05+0.08*k;const dx=(s.dx||0)*k*40,dy=(s.dy||0)*k*40;
  el.style.transform='translate('+dx+'px,'+dy+'px) scale('+(s.out?1.13-0.08*k:z)+')';
  if(a>0.5)document.getElementById('cr').textContent=s.cr});
 const h=document.getElementById('hook');h.style.opacity=1-E(3.7,0.3,t);h.style.transform='translateY('+(-30*E(3.7,0.3,t))+'px)';
 CARDS.forEach((c,i)=>{const el=document.getElementById('c'+i);const k=E(c.a,0.3,t)*(1-E(c.b,0.3,t));el.style.opacity=k;
  el.style.transform='rotate('+(c.r||0)+'deg) scale('+((c.cls.includes('stamp')?1.8:1.12)-((c.cls.includes('stamp')?0.8:0.12))*E(c.a,0.3,t))+')'});
 document.getElementById('turb').setAttribute('seed',Math.floor(t*12)%50);
 const cap=document.getElementById('cap');let p=null;if(t>3.85&&t<END){for(const q of PH){if(t>=q[0][1]-0.05&&t<=q[q.length-1][2]+0.3)p=q}}
 cap.innerHTML=p?p.map(w=>'<span style="color:'+(t>=w[1]-0.02?'#f2e35b':'#fff')+'">'+w[0]+'</span>').join(' '):'';
 const en=document.getElementById('end');en.style.opacity=E(END,0.35,t);
}
